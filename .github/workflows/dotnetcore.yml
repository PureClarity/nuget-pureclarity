name: build

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --configuration Release --no-build
    - name: Pack
      run: dotnet pack src/PureClarity/PureClarity.csproj --configuration Release --no-build --output ./artifacts
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
